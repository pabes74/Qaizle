name: Generate Qaizle Quiz
description: Generates a PR reviewer quiz and creates its pending check run.

inputs:
  github-token:
    description: Token with the required pull-request, issue, model, and check permissions.
    required: true
  repository:
    description: Repository in owner/name format.
    required: true
  pr-number:
    description: Pull request number.
    required: true
  model:
    description: GitHub Models id, or the model name at your own provider when ai-endpoint is set.
    required: false
    default: openai/gpt-4.1-mini
  ai-endpoint:
    description: OpenAI-compatible base URL or full /chat/completions URL. Empty uses GitHub Models.
    required: false
    default: ""
  ai-api-key:
    description: API key for ai-endpoint. Pass it from a secret. Empty uses the GitHub token with GitHub Models.
    required: false
    default: ""
  ai-auth-style:
    description: How the API key is sent, either "bearer" (Authorization header) or "api-key" (api-key header, Azure OpenAI).
    required: false
    default: bearer
  ai-json-mode:
    description: Send response_format json_object, either "auto", "on" or "off".
    required: false
    default: auto
  max-files:
    description: Maximum changed files to include in analysis.
    required: false
    default: "30"
  pass-threshold:
    description: Minimum number of correct answers required to pass.
    required: false
    default: "3"
  run-url:
    description: URL for the workflow run that generated the quiz.
    required: false
  provider:
    description: Quiz generation provider, "copilot" (GitHub Models) or "claude" (Anthropic API).
    required: false
    default: copilot
  anthropic-api-key:
    description: Anthropic API key. Required when provider is "claude".
    required: false
  claude-model:
    description: Claude model identifier, used when provider is "claude".
    required: false
    default: claude-haiku-4-5

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Generate reviewer quiz
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        TARGET_REPOSITORY: ${{ inputs.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
        QUIZ_MODEL: ${{ inputs.model }}
        MAX_FILES: ${{ inputs.max-files }}
        MIN_CORRECT: ${{ inputs.pass-threshold }}
        RUN_URL: ${{ inputs.run-url }}
